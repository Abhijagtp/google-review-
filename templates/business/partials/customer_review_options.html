<div class="space-y-6 animate-fade-in">
    
    <!-- Title & Variant Switcher -->
    <div>
        <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Step 2 • Choose & Edit Your Review</span>
            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-blue-50 text-blue-700 border border-blue-200">3 Options Generated</span>
        </div>
        <p class="text-xs text-slate-600">Select the version you like best, edit any text below, then continue to Google.</p>
    </div>

    <!-- Option Variant Tabs -->
    <div class="grid grid-cols-3 gap-2 p-1 bg-slate-100 rounded-xl border border-slate-200">
        {% for opt in options %}
        <button 
            type="button" 
            onclick="switchOption({{ opt.id }}, '{{ opt.text|escapejs }}')"
            id="tab-btn-{{ opt.id }}" 
            class="tab-btn py-2.5 px-3 rounded-lg text-xs font-bold transition-all text-center border shadow-sm {% if forloop.first %}bg-slate-900 text-white border-slate-900 shadow-md{% else %}bg-transparent text-slate-600 border-transparent hover:text-slate-900{% endif %}">
            <span>{{ opt.title }}</span>
            <span class="block text-[10px] font-normal opacity-80 mt-0.5 truncate">{{ opt.subtitle }}</span>
        </button>
        {% endfor %}
    </div>

    <!-- Fully Editable Review Textbox -->
    <div>
        <label for="final_review_text" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
            Your Review Text (Fully Editable)
        </label>
        <div class="relative">
            <textarea 
                id="final_review_text" 
                rows="5" 
                class="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 font-sans text-sm sm:text-base leading-relaxed focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent shadow-inner transition-all resize-y"
                placeholder="Your generated review text will appear here...">{{ options.0.text }}</textarea>
            
            <div class="absolute bottom-3 right-3 text-[11px] text-slate-400 font-medium bg-white/80 backdrop-blur px-2 py-1 rounded-md border border-slate-200">
                Click to edit text
            </div>
        </div>
    </div>

    <!-- Copy Status Notification Toast -->
    <div id="copy-toast" class="hidden p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-900 font-semibold flex items-center justify-center gap-2">
        <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
        <span>Review copied to clipboard! Opening Google Reviews...</span>
    </div>

    <!-- Final CTA Button -->
    <button 
        type="button" 
        onclick="copyAndRedirectToGoogle('{{ google_review_url|escapejs }}')"
        class="w-full py-4 px-6 bg-slate-900 hover:bg-slate-800 text-white font-bold text-base rounded-xl shadow-lg shadow-slate-900/10 transition-all flex items-center justify-center gap-2 active:scale-[0.99]">
        <span>Continue to Google →</span>
    </button>
</div>

<script>
    const optionsData = {
        {% for opt in options %}
        {{ opt.id }}: "{{ opt.text|escapejs }}",
        {% endfor %}
    };

    function switchOption(id, text) {
        document.getElementById('final_review_text').value = optionsData[id] || text;
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.className = "tab-btn py-2.5 px-3 rounded-lg text-xs font-bold transition-all text-center border shadow-sm bg-transparent text-slate-600 border-transparent hover:text-slate-900";
        });
        
        const activeBtn = document.getElementById('tab-btn-' + id);
        if (activeBtn) {
            activeBtn.className = "tab-btn py-2.5 px-3 rounded-lg text-xs font-bold transition-all text-center border shadow-sm bg-slate-900 text-white border-slate-900 shadow-md";
        }
    }

    function copyAndRedirectToGoogle(googleUrl) {
        const text = document.getElementById('final_review_text').value.trim();
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text);
        } else {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
        }

        // Track copy & redirect metric via background ping
        try {
            fetch("{% url 'business:track_copy' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}"
                }
            });
        } catch(e) {}

        const toast = document.getElementById('copy-toast');
        if (toast) {
            toast.classList.remove('hidden');
        }

        setTimeout(() => {
            if (googleUrl && googleUrl !== '#') {
                window.open(googleUrl, '_blank');
            } else {
                alert('Review copied to clipboard! (Please add your Google Review URL in Business Settings)');
            }
        }, 600);
    }
</script>
