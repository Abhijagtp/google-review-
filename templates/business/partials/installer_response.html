{% if success %}
<div class="p-4 mb-6 text-sm text-emerald-900 bg-emerald-50 border border-emerald-200 rounded-xl flex items-center justify-between shadow-sm animate-fade-in">
    <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-emerald-600 text-white flex items-center justify-center shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <div>
            <h4 class="font-bold text-slate-900 text-sm">Connection & Migrations Successful!</h4>
            <p class="text-slate-600 text-xs mt-0.5">{{ message }}</p>
        </div>
    </div>
    <span class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-300">Ready</span>
</div>

<div class="mt-6 pt-5 border-t border-slate-200 text-center">
    <p class="text-slate-500 text-xs font-medium mb-3">Database initialization complete.</p>
    <button disabled class="w-full py-3.5 px-4 bg-emerald-50 text-emerald-800 font-semibold text-sm rounded-xl border border-emerald-200 opacity-90 cursor-not-allowed flex items-center justify-center gap-2 shadow-sm">
        <span>Step 0 Complete — Ready for Step 1 Onboarding</span>
        <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
        </svg>
    </button>
</div>
{% else %}
<div class="p-4 mb-6 text-sm text-rose-900 bg-rose-50 border border-rose-200 rounded-xl flex items-center gap-3 shadow-sm animate-fade-in">
    <div class="w-8 h-8 rounded-lg bg-rose-600 text-white flex items-center justify-center shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
    </div>
    <div>
        <h4 class="font-bold text-slate-900 text-sm">Setup Error</h4>
        <p class="text-rose-700 text-xs mt-0.5">{{ message }}</p>
    </div>
</div>
{% endif %}
