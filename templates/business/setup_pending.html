<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup in Progress — AI Review Booster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
        }
        .bg-subtle-pattern {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between p-4 sm:p-8 bg-subtle-pattern antialiased">

    <header class="max-w-lg mx-auto w-full flex items-center justify-between py-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center font-bold text-lg shadow-md">
                R
            </div>
            <div>
                <span class="font-bold text-slate-900 tracking-tight text-base">ReviewBooster</span>
                <span class="text-xs text-slate-500 block">Customer Feedback Portal</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-md mx-auto my-auto py-8">
        <div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-xl text-center space-y-4">
            <div class="w-14 h-14 rounded-2xl bg-amber-50 border border-amber-200 text-amber-600 flex items-center justify-center mx-auto shadow-sm">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>

            <div class="space-y-2">
                <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">Review System Setup in Progress</h1>
                <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">
                    This business is currently finalizing their AI review system onboarding. Please check back shortly!
                </p>
            </div>

            <div class="pt-2">
                <a href="{% url 'business:installer' %}" class="inline-flex items-center justify-center px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl border border-slate-300 transition-all">
                    Are you the business owner? Complete Setup →
                </a>
            </div>
        </div>
    </main>

    <footer class="max-w-lg mx-auto w-full text-center py-4">
        <p class="text-xs text-slate-400 font-medium">AI Review Booster</p>
    </footer>

</body>
</html>
